name: Release

# Tag-driven. `git tag -a v0.2.0 && git push origin v0.2.0` is the whole ritual:
# it checks, tests, builds the four binaries, cuts the GitHub release, and
# publishes the crate -- in that order, with the irreversible step last.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time per tag. Two runs on the same ref would race each other
# to create the GitHub release and to publish the crate.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything that can say "do not release this" says it HERE, before a single
  # binary is built and long before anything irreversible happens.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First, and cheap: a release whose binary reports a different version to
      # its tag is worse than no release.
      - name: tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag crate=$crate"
          [ "$tag" = "$crate" ] || { echo "::error::tag v$tag != Cargo.toml $crate"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
      - name: system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxkbcommon-x11-dev

      # Prove the PACKAGED crate compiles, which is not the same as proving the
      # working tree does: `exclude` in Cargo.toml keeps files out of the
      # tarball, and this repository excludes `assets/icon-master*.png` while
      # compiling other files from `assets/` straight into the binary. Get that
      # list wrong and the crate is broken for everyone who installs it.
      #
      # It happens here, in the gate, rather than inside `cargo publish` at the
      # end. There it would be the first check of the tarball -- discovered only
      # after four binaries were built and the GitHub release was public. Here it
      # costs a minute and nothing has been published yet.
      #
      # No token exists in this job. That is the point: verifying means BUILDING,
      # and building runs the build scripts and proc macros of every dependency.
      - name: the packaged crate compiles
        run: cargo package --locked

  # The tests, on all three platforms, on the commit being released -- not on
  # whatever ran earlier for some other reason. `ci.yml` itself, called, so there
  # is one definition of "tested" and it cannot drift from what pull requests are
  # held to.
  test:
    needs: check-version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: test
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built INSIDE Debian 12 rather than on whatever the runner image
          # happens to be. A binary demands the glibc it was linked against, and
          # the newest runner produces one that will not start on most of the
          # distributions people actually run:
          #
          #   built on ubuntu-latest (2.39) -> Debian 12 says
          #     "version `GLIBC_2.39' not found" and refuses to load
          #
          # Built in bookworm the floor comes out at GLIBC_2.34 -- lower than the
          # container's own 2.36, because that is as high as this code reaches.
          # Verified to run on Debian 12, Ubuntu 22.04 and Rocky 9; Debian 11
          # (2.31) is the first one it misses.
          #
          # A container rather than the ubuntu-22.04 runner because that image is
          # being retired, and a release pipeline that stops working when GitHub
          # removes an image is a release pipeline that fails at the worst time.
          - name: linux-x86_64
            os: ubuntu-latest
            container: rust:1-bookworm
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      # The Linux job already has a toolchain: it is a rust image. The others
      # need one installed.
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.container == ''
        with:
          targets: ${{ matrix.target }}

      - name: system libraries
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y libxkbcommon-dev libwayland-dev libxkbcommon-x11-dev

      - run: cargo build --release --locked --target ${{ matrix.target }}

      # Authenticode, so Windows names a publisher instead of warning that this
      # came from an unknown one. Azure Artifact Signing rather than a bought
      # certificate: since 2023 a publicly trusted code signing certificate has
      # to live on a hardware token or an HSM, which is close to unworkable in
      # CI, and this is Microsoft's own answer to that -- the key stays in their
      # HSM and the runner never holds it.
      #
      # The three Azure values below are `vars`, not `secrets`: an endpoint, an
      # account name and a profile name are configuration, not credentials, and
      # the code signing SOP holds them as ORGANIZATION variables beside the
      # organization secrets.
      #
      # Inert without credentials, like every other signing step here.
      - name: are there signing credentials?
        id: winsign
        if: runner.os == 'Windows'
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$CLIENT_ID" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AZURE_CLIENT_ID is not set; mdblaze.exe will be unsigned and SmartScreen will warn"
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: sign mdblaze.exe
        if: runner.os == 'Windows' && steps.winsign.outputs.have == 'true'
        uses: Azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\target\${{ matrix.target }}\release\mdblaze.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Proof it took, rather than a green step that signed nothing. `signtool`
      # is on the runner image as part of the Windows SDK.
      - name: the signature verifies
        if: runner.os == 'Windows' && steps.winsign.outputs.have == 'true'
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/mdblaze.exe"
          $sig = Get-AuthenticodeSignature $exe
          $sig | Format-List
          if ($sig.Status -ne 'Valid') { throw "signature is $($sig.Status)" }

      # A tarball on Unix and a zip on Windows, each carrying the licences --
      # the Noto faces inside the binary are OFL and that text has to travel
      # with it. See NOTICE.
      - name: package
        shell: bash
        run: |
          set -eu
          out="mdblaze-${{ matrix.name }}"
          mkdir -p "dist/$out"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/mdblaze.exe" "dist/$out/"
          else
            cp "target/${{ matrix.target }}/release/mdblaze" "dist/$out/"
          fi
          cp README.md NOTICE LICENSE-MIT LICENSE-APACHE "dist/$out/"
          cp assets/fonts/LICENSE-Noto.txt "dist/$out/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$out.zip" "$out" > /dev/null
          else
            tar czf "$out.tar.gz" "$out"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error


  # macOS gets a job of its own rather than two rows in the matrix above, because
  # what ships is ONE artifact: a universal binary, inside a bundle, inside a disk
  # image, signed and notarized and stapled as a single thing. Two rows on two
  # runners cannot `lipo` anything together, and it would mean two trips to Apple
  # for one release.
  #
  # Every signing step is inert without credentials. No certificate means a
  # warning and an unsigned build, not a failed one, so the pipeline works today
  # and starts signing the day it is given something to sign with.
  #
  # The secret NAMES are not chosen here. They come from the Wahle-Tec code
  # signing SOP, which buys each platform identity once and stores its credentials
  # once, at the GitHub organization level, for every package that ships a binary.
  # Inventing names for this repository would mean minting a second copy of the
  # same secret, and the two would drift the first time one was rotated.
  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: build both architectures
        run: |
          set -eu
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      # One binary that runs on both. `lipo` is Apple's own tool for it, and the
      # result is what Mac software has shipped since the PowerPC transition. It
      # ends the "which download do I need?" question, which is not a question a
      # text editor should be asking anybody.
      - name: one universal binary
        run: |
          set -eu
          mkdir -p dist
          lipo -create -output dist/mdblaze \
            target/aarch64-apple-darwin/release/mdblaze \
            target/x86_64-apple-darwin/release/mdblaze
          lipo -info dist/mdblaze

      # Built by the program itself, so the `Info.plist` in a signed release and
      # the one `--install-handler` writes come out of the same tested function
      # and cannot drift. The binary is universal, so it runs here whatever this
      # runner turns out to be.
      - name: the application bundle
        run: ./dist/mdblaze --bundle dist/mdblaze.app

      - name: are there signing credentials?
        id: creds
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$CERT" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::APPLE_CERTIFICATE is not set; the macOS build will be unsigned and macOS will quarantine it"
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: a keychain holding the certificate
        if: steps.creds.outputs.have == 'true'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -eu
          # A keychain belonging to this run, with a password nobody chose,
          # deleted when the job ends. Importing into the login keychain would
          # leave a Developer ID certificate sitting on a shared runner image.
          pw=$(openssl rand -base64 24)
          echo "::add-mask::$pw"
          echo "KEYCHAIN_PASSWORD=$pw" >> "$GITHUB_ENV"
          security create-keychain -p "$pw" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$pw" build.keychain
          # A timeout long enough to outlast notarization. The default relocks
          # the keychain after five minutes, and Apple can take longer than that
          # -- at which point signing fails for a reason that looks like nothing
          # to do with time.
          security set-keychain-settings -t 3600 -u build.keychain
          printf '%s' "$CERT" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f cert.p12
          # Without this, every `codesign` stops for a GUI password prompt that
          # nobody is there to answer, and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: sign the application
        if: steps.creds.outputs.have == 'true'
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -eu
          # `--options runtime` turns on the hardened runtime, which notarization
          # refuses a submission without. `--timestamp` records a trusted
          # timestamp so the signature stays valid after the certificate itself
          # expires -- without it, every release ever published stops verifying
          # on the day the certificate lapses.
          codesign --force --options runtime --timestamp --sign "$IDENTITY" dist/mdblaze.app
          codesign --verify --strict --verbose=2 dist/mdblaze.app

      # Taken back OUT of the signed bundle rather than signed separately, so the
      # binary in the tarball is byte-for-byte the one that was notarized.
      - name: the signed binary, for the tarball
        run: cp dist/mdblaze.app/Contents/MacOS/mdblaze dist/mdblaze

      - name: the disk image
        run: |
          set -eu
          mkdir -p dmg
          cp -R dist/mdblaze.app dmg/
          # The Applications symlink is the whole ceremony of installing a Mac
          # application: open, drag left to right, done.
          ln -s /Applications dmg/Applications
          hdiutil create -volname mdblaze -srcfolder dmg -ov -format UDZO dist/mdblaze-macos.dmg

      - name: notarize and staple
        if: steps.creds.outputs.have == 'true'
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -eu
          codesign --force --timestamp --sign "$IDENTITY" dist/mdblaze-macos.dmg
          printf '%s' "$KEY" | base64 --decode > key.p8
          xcrun notarytool submit dist/mdblaze-macos.dmg \
            --key key.p8 --key-id "$KEY_ID" --issuer "$ISSUER" --wait --timeout 30m
          rm -f key.p8
          # Staple the ticket INTO the image, so Gatekeeper approves it with no
          # network at all. Only a bundle, a disk image or an installer can be
          # stapled -- a bare executable cannot -- and that is the practical
          # reason a .dmg is what this ships rather than only a tarball.
          xcrun stapler staple dist/mdblaze-macos.dmg
          xcrun stapler validate dist/mdblaze-macos.dmg

      - name: package
        run: |
          set -eu
          out=mdblaze-macos-universal
          mkdir -p "dist/$out"
          cp dist/mdblaze "dist/$out/"
          cp README.md NOTICE LICENSE-MIT LICENSE-APACHE "dist/$out/"
          cp assets/fonts/LICENSE-Noto.txt "dist/$out/"
          cd dist && tar czf "$out.tar.gz" "$out"

      # `always()`, so a failed notarization does not leave a Developer ID
      # certificate unlocked in a keychain on the runner.
      - name: take the keychain away
        if: always() && steps.creds.outputs.have == 'true'
        run: security delete-keychain build.keychain || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            dist/*.tar.gz
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: [build, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # `contents` to create the release. `id-token` and `attestations` are what
      # `attest-build-provenance` needs, and neither is a stored credential: the
      # signing identity IS this workflow's OIDC identity, so there is nothing to
      # keep in secrets and nothing to leak or rotate. This is a different thing
      # from the publishing token, which stays a secret because a registry
      # credential is a credential.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Checksums, so somebody who downloads a binary from the internet can tell
      # whether it is the one that was built here.
      - name: checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip *.dmg > SHA256SUMS
          cat SHA256SUMS

      # What a checksum file cannot do on its own: say who made it.
      #
      # SHA256SUMS proves an archive was not altered in transit. It proves
      # nothing about where it came from -- anyone can build a different binary
      # and publish a matching checksum beside it. An attestation is signed by
      # GitHub against this workflow's own identity and recorded in a public
      # transparency log, so `gh attestation verify` answers the question the
      # checksum cannot: this archive was built by THIS workflow, from THIS
      # repository, at THIS commit.
      #
      # Free, keyless, and no use whatsoever against Gatekeeper or SmartScreen --
      # those want a certificate from Apple or a CA, which is a separate thing
      # with a separate bill. This is provenance, not code signing.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg

      # A detached OpenPGP signature over the checksum file, for the platform
      # with no notion of a trusted publisher at all. Linux has no Gatekeeper to
      # satisfy; what it has is a convention -- a `.asc` beside the sums and a
      # key people can fetch once -- which is how every distribution has shipped
      # for thirty years.
      #
      # Inert until the key exists, so the pipeline works today and starts
      # signing the moment it is given something to sign with.
      - name: is there a signing key?
        id: gpg
        env:
          KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GPG_PRIVATE_KEY is not set; SHA256SUMS will not be signed"
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: sign the checksums
        if: steps.gpg.outputs.have == 'true'
        env:
          KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -eu
          # A throwaway keyring in the runner's own temp directory, never the
          # default one, so nothing is left behind for a later step to pick up.
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"
          printf '%s' "$KEY" | gpg --batch --quiet --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          echo "signing with $key"
          printf '%s' "$PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --local-user "$key" \
            --armor --detach-sign --output dist/SHA256SUMS.asc dist/SHA256SUMS
          # Prove the signature verifies before it goes anywhere near a release.
          gpg --verify dist/SHA256SUMS.asc dist/SHA256SUMS
          rm -rf "$GNUPGHOME"

      - name: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Built as a list rather than a glob with a fallback: the signature is
          # only there when a key was configured, and a second `gh release
          # create` behind an `||` would also fire on failures that have nothing
          # to do with a missing file.
          assets=(dist/*.tar.gz dist/*.zip dist/*.dmg dist/SHA256SUMS)
          if [ -f dist/SHA256SUMS.asc ]; then assets+=(dist/SHA256SUMS.asc); fi
          printf 'releasing %s\n' "${assets[@]}"
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            "${assets[@]}"

  # LAST, deliberately. Everything above this can be done again: a tag can be
  # moved, a GitHub release deleted and recut. A crates.io version cannot -- it
  # can be yanked so nothing new picks it up, but it is never removed, and the
  # version number is spent forever. So it happens only once every reversible
  # thing has already succeeded.
  #
  # The credential is `CARGO_REGISTRY_TOKEN` in this repository's secrets. Give it
  # the NARROWEST scope crates.io offers for the job: endpoint `publish-update`,
  # restricted to the crate `mdblaze`. So scoped, it can do exactly one thing --
  # put up a new version of this crate -- and nothing else on the account: not a
  # new crate, not a yank, not an ownership change.
  #
  # It is read in ONE step, the last one, and that step runs no third-party code.
  # See the `--no-verify` note below for why that matters.
  crates-io:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # Naming any permission at job level REPLACES the workflow's block rather
      # than adding to it, and everything left out becomes `none`. This job reads
      # the repository and writes nothing, so that is all it gets -- the
      # workflow-wide `contents: write` the release job needs does not reach it.
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # A re-run must not fail for the wrong reason. If a runner flakes and the
      # workflow is run again on the same tag, the version is already up and
      # `cargo publish` would exit non-zero -- turning a green release red over
      # work that had, in fact, already succeeded. Skipped and said out loud.
      #
      # Only 200 and 404 are answers. Anything else -- a rate limit, a 5xx, no
      # route to the host -- is NOT "the version is missing", and reporting it as
      # one would put a lie in the log.
      - name: is this version already up?
        id: published
        run: |
          set -eu
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          url="https://crates.io/api/v1/crates/mdblaze/$v"
          # A User-Agent is not optional: crates.io answers 403 without one.
          code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 30 \
                   -A "mdblaze release workflow (github.com/Redstone-Logic/mdblaze)" \
                   "$url") || code=000
          case "$code" in
            200)
              echo "::notice::mdblaze $v is already on crates.io -- nothing to publish"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "mdblaze $v is not on crates.io yet"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              # Carry on, and let `cargo publish` be the judge. It talks to the
              # same registry, which refuses a duplicate version server-side, so
              # the worst case is an honest error -- never two of anything.
              # Stopping here instead would turn a registry hiccup into a failed
              # release of a version that was never up, which is the more common
              # and the more expensive mistake.
              echo "::warning::crates.io answered $code, neither 200 nor 404 -- cannot tell whether $v is up; letting cargo publish decide"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # A missing secret should say so, rather than reaching cargo and coming back
      # as an authentication failure that reads like the token is wrong.
      - name: the token exists
        if: steps.published.outputs.skip == 'false'
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || {
            echo "::error::CARGO_REGISTRY_TOKEN is not set in this repository's secrets."
            echo "::error::Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          }

      # `--no-verify` because the gate job ALREADY built this exact tarball, from
      # this exact commit, and proved it compiles. Verified byte-for-byte: with
      # and without the rebuild, the same commit packages to the same SHA256, so
      # what was proven there is what is uploaded here. Doing it again here would add
      # nothing except the one thing worth avoiding: `cargo` verifies by
      # BUILDING, and a build runs the build scripts and proc macros of every
      # dependency -- 63 of them in this tree -- with the registry token sitting
      # in their environment. Skipping the rebuild means no third-party code runs
      # anywhere near the credential.
      #
      # That mattered when the token lasted thirty minutes. It matters MORE now
      # that it is a long-lived secret: a build script that read it would hold
      # publishing rights to this crate until somebody noticed and revoked it.
      #
      # `--locked` so the tarball is cut from the same dependency versions the
      # binaries were tested against, not whatever has been released since.
      - name: cargo publish
        if: steps.published.outputs.skip == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --no-verify
