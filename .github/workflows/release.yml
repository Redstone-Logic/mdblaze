name: Release

# Tag-driven. `git tag v0.2.0 && git push origin v0.2.0` is the whole ritual:
# it builds the four binaries, cuts the GitHub release, and publishes the crate.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fails the whole thing before any of the slow builds start, because a release
  # whose binary reports a different version to its tag is worse than no release.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag crate=$crate"
          [ "$tag" = "$crate" ] || { echo "::error::tag v$tag != Cargo.toml $crate"; exit 1; }

  build:
    needs: check-version
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built INSIDE Debian 12 rather than on whatever the runner image
          # happens to be. A binary demands the glibc it was linked against, and
          # the newest runner produces one that will not start on most of the
          # distributions people actually run:
          #
          #   built on ubuntu-latest (2.39) -> Debian 12 says
          #     "version `GLIBC_2.39' not found" and refuses to load
          #
          # Built in bookworm the floor comes out at GLIBC_2.34 -- lower than the
          # container's own 2.36, because that is as high as this code reaches.
          # Verified to run on Debian 12, Ubuntu 22.04 and Rocky 9; Debian 11
          # (2.31) is the first one it misses.
          #
          # A container rather than the ubuntu-22.04 runner because that image is
          # being retired, and a release pipeline that stops working when GitHub
          # removes an image is a release pipeline that fails at the worst time.
          - name: linux-x86_64
            os: ubuntu-latest
            container: rust:1-bookworm
            target: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      # The Linux job already has a toolchain: it is a rust image. The others
      # need one installed.
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.container == ''
        with:
          targets: ${{ matrix.target }}

      - name: system libraries
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y libxkbcommon-dev libwayland-dev libxkbcommon-x11-dev

      - run: cargo build --release --locked --target ${{ matrix.target }}

      # A tarball on Unix and a zip on Windows, each carrying the licences --
      # the Noto faces inside the binary are OFL and that text has to travel
      # with it. See NOTICE.
      - name: package
        shell: bash
        run: |
          set -eu
          out="mdblaze-${{ matrix.name }}"
          mkdir -p "dist/$out"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/mdblaze.exe" "dist/$out/"
          else
            cp "target/${{ matrix.target }}/release/mdblaze" "dist/$out/"
          fi
          cp README.md NOTICE LICENSE-MIT LICENSE-APACHE "dist/$out/"
          cp assets/fonts/LICENSE-Noto.txt "dist/$out/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$out.zip" "$out" > /dev/null
          else
            tar czf "$out.tar.gz" "$out"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Checksums, so somebody who downloads a binary from the internet can tell
      # whether it is the one that was built here.
      - name: checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS

  # LAST, deliberately. Everything above this can be done again: a tag can be
  # moved, a GitHub release deleted and recut. A crates.io version cannot -- it
  # can be yanked so nothing new picks it up, but it is never removed, and the
  # version number is spent forever. So it happens only once every reversible
  # thing has already succeeded.
  #
  # No API token is stored for this, here or in the repository's secrets. The
  # job asks GitHub for an OIDC token, crates.io trades that for one of its own
  # that lasts minutes, and the action revokes it when the job ends. crates.io
  # decides whether to make that trade from the Trusted Publishing configuration
  # on the crate itself, which names this repository and this filename -- so
  # RENAMING THIS FILE breaks publishing until the configuration is updated to
  # match.
  crates-io:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # The one permission that makes the whole arrangement work, and it is not
      # on by default. Without it there is no OIDC token to trade.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # `cargo publish` builds the packaged crate before uploading it, to prove
      # the tarball actually compiles. That build needs the same X11 and Wayland
      # headers the test job installs, and without them it fails in a way that
      # reads as a Rust problem rather than a missing package.
      - name: system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxkbcommon-x11-dev

      # A re-run must not fail for the wrong reason. If a runner flakes and the
      # workflow is run again on the same tag, the version is already up and
      # `cargo publish` would exit non-zero -- turning a green release red over
      # work that had, in fact, already succeeded. Skipped and said out loud.
      #
      # Only 200 and 404 are answers. Anything else -- a rate limit, a 5xx, no
      # route to the host -- is NOT "the version is missing", and reporting it as
      # one would put a lie in the log.
      - name: is this version already up?
        id: published
        run: |
          set -eu
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          url="https://crates.io/api/v1/crates/mdblaze/$v"
          # A User-Agent is not optional: crates.io answers 403 without one.
          code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 30 \
                   -A "mdblaze release workflow (github.com/Redstone-Logic/mdblaze)" \
                   "$url") || code=000
          case "$code" in
            200)
              echo "::notice::mdblaze $v is already on crates.io -- nothing to publish"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "mdblaze $v is not on crates.io yet"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              # Carry on, and let `cargo publish` be the judge. It talks to the
              # same registry, which refuses a duplicate version server-side, so
              # the worst case is an honest error -- never two of anything.
              # Stopping here instead would turn a registry hiccup into a failed
              # release of a version that was never up, which is the more common
              # and the more expensive mistake.
              echo "::warning::crates.io answered $code, neither 200 nor 404 -- cannot tell whether $v is up; letting cargo publish decide"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # `@v1` is a moving BRANCH in that repository, not a tag -- there is no `v1`
      # tag, only `v1.0.x` -- so this follows their v1 line the same way
      # `dtolnay/rust-toolchain@stable` follows Rust's.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.published.outputs.skip == 'false'

      # `--locked` so the crate is built from the same dependency versions the
      # tested binaries were, rather than whatever has been released since.
      - name: cargo publish
        if: steps.published.outputs.skip == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
