[package]
name = "mdblaze"
version = "0.1.0"
edition = "2021"
description = "A markdown editor that renders, and opens instantly."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Redstone-Logic/mdblaze"
homepage = "https://github.com/Redstone-Logic/mdblaze"
keywords = ["markdown", "editor", "viewer", "gui", "startup"]
categories = ["text-editors", "gui", "text-processing"]
# The Noto faces are compiled in and are SIL OFL 1.1, not MIT/Apache. The SPDX
# field above describes the CODE, which is the convention; see NOTICE for what
# the binary actually contains and what travels with it.
# The masters are the artwork but the build does not read them -- only the
# derived icons are compiled in. No need to ship 600KB of PNG to every
# `cargo install`.
exclude = ["/docs", "/tests/fixtures", "*.ppm", "assets/make-icons.py", "assets/icon-master*.png"]

[dependencies]
# The parser only. This crate lays text out itself rather than producing HTML,
# so it takes the event stream and never builds a document tree it would then
# have to walk again.
pulldown-cmark = { version = "0.13", default-features = false }
# Windowing across X11, Wayland, macOS and Windows.
winit = "0.30"
# A CPU framebuffer. Deliberately NOT wgpu: creating a GPU context is the single
# largest startup cost in a modern GUI stack, and this program draws static text.
softbuffer = "0.4"
# A LAZY, zero-copy font reader. Not fontdue: that parses every glyph in the
# face on load, which measured 36ms per face -- 95% of this program's startup,
# paid to build outlines for glyphs no document uses. See `text.rs`.
ab_glyph = "0.2"
# Mermaid diagrams, rendered to Unicode box-drawing TEXT.
#
# Chosen over the SVG renderers for one reason: those need an SVG rasteriser, and
# `resvg` pulls 84 crates including `fontdb` -- the font-scanning machinery this
# program deliberately does not have, because scanning fonts costs more than
# everything else here put together. This produces text, and text is the one
# thing this program already knows how to draw.
mermaid-text = "0.57"
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
png = { version = "0.18.1", default-features = false }
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std"] }
memmap2 = "0.9.11"
# The system's own file chooser. Two crates on Linux, where it speaks to
# xdg-desktop-portal over D-Bus rather than linking GTK; native panels on macOS
# and Windows. Chosen over a picker of our own because typing a path is what
# `mdblaze notes.md` already does -- a second way to type a path serves nobody,
# and the people who need a chooser are exactly the ones not in a terminal.
#
# `xdg-portal` and not `gtk3`: linking GTK would pull in the toolkit this
# program is built without.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# The system clipboard. `default-features = false` drops `image-data`, which
# exists to put PICTURES on the clipboard and drags in the whole `image` crate
# to do it -- this program copies text.
#
# `wayland-data-control` is the other half and is kept: without it the only
# backend on Linux is X11, so on a Wayland session copy and paste would work
# only where XWayland happens to be running and the compositor happens to bridge
# the two clipboards. That is most desktops and not all of them, and "copy
# silently did nothing" is the worst kind of bug to ship. It costs nothing on
# macOS or Windows -- the dependency is gated to Linux inside arboard.
#
# Opened lazily, on the first copy or paste. Constructing it connects to the
# display server and starts a thread; see `clip.rs`.
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

# Windows only, and it costs the other platforms nothing: cargo does not build
# or fetch it for a target it is not gated to. The registry is the only place
# Windows keeps file associations, and there is no portable way to reach it.
[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
