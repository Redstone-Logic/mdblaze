[package]
name = "mdblaze"
version = "0.1.0"
edition = "2021"
description = "A markdown editor that renders, and opens instantly."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Redstone-Logic/mdblaze"
homepage = "https://github.com/Redstone-Logic/mdblaze"
keywords = ["markdown", "editor", "viewer", "gui", "startup"]
categories = ["text-editors", "gui", "text-processing"]
# The Noto faces are compiled in and are SIL OFL 1.1, not MIT/Apache. The SPDX
# field above describes the CODE, which is the convention; see NOTICE for what
# the binary actually contains and what travels with it.
exclude = ["/docs", "/tests/fixtures", "*.ppm", "assets/make-icons.py"]

[dependencies]
# The parser only. This crate lays text out itself rather than producing HTML,
# so it takes the event stream and never builds a document tree it would then
# have to walk again.
pulldown-cmark = { version = "0.13", default-features = false }
# Windowing across X11, Wayland, macOS and Windows.
winit = "0.30"
# A CPU framebuffer. Deliberately NOT wgpu: creating a GPU context is the single
# largest startup cost in a modern GUI stack, and this program draws static text.
softbuffer = "0.4"
# A LAZY, zero-copy font reader. Not fontdue: that parses every glyph in the
# face on load, which measured 36ms per face -- 95% of this program's startup,
# paid to build outlines for glyphs no document uses. See `text.rs`.
ab_glyph = "0.2"
# Mermaid diagrams, rendered to Unicode box-drawing TEXT.
#
# Chosen over the SVG renderers for one reason: those need an SVG rasteriser, and
# `resvg` pulls 84 crates including `fontdb` -- the font-scanning machinery this
# program deliberately does not have, because scanning fonts costs more than
# everything else here put together. This produces text, and text is the one
# thing this program already knows how to draw.
mermaid-text = "0.57"
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
png = { version = "0.18.1", default-features = false }
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std"] }
memmap2 = "0.9.11"

# Windows only, and it costs the other platforms nothing: cargo does not build
# or fetch it for a target it is not gated to. The registry is the only place
# Windows keeps file associations, and there is no portable way to reach it.
[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
